<knv-page-layout>
  <knv-breadcrumbs
    [current]="'Análisis de Pisada'"
    [crumbs]="[{ name: 'Episodios', link: '/management-pacient/episodes' },
    { name: 'Sesiones', link: '/management-pacient/episodes/' + episodeId + '/sessions' }]">
  </knv-breadcrumbs>

  <mat-card class="imaging-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>directions_walk</mat-icon>
        Análisis de Pisada
      </mat-card-title>
      <mat-card-subtitle *ngIf="footAnalysis">
        Sesión #{{ footAnalysis.sessionNumber }} — {{ footAnalysis.patientFullName }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content *ngIf="!isLoading">
      <mat-stepper #stepper linear orientation="horizontal" class="imaging-stepper">

        <!-- PASO 1: Captura de Imágenes -->
        <mat-step label="Captura de Fotos">
          <knv-photo-gallery
            [footAnalysis]="footAnalysis"
            (next)="onPhotosCaptured($event)">
          </knv-photo-gallery>
        </mat-step>

        <!-- PASO 2: Trazos y Mediciones -->
        <mat-step label="Análisis de Trazos">
          <knv-photo-canvas
            [footAnalysis]="footAnalysis"
            [tempPhotos]="tempPhotos"
            (prev)="prevStep()"
            (next)="onAnglesConfirmed($event)">
          </knv-photo-canvas>
        </mat-step>

        <!-- PASO 3: Evaluación Final y Guardado -->
        <mat-step label="Evaluación e Informe">
          <knv-summary-form
            [footAnalysis]="footAnalysis"
            [tempPhotos]="tempPhotos"
            [capturedAngles]="finalAngles"
            (prev)="prevStep()"
            (saved)="onAnalysisSaved()">
          </knv-summary-form>
        </mat-step>

      </mat-stepper>
    </mat-card-content>
  </mat-card>

</knv-page-layout>
