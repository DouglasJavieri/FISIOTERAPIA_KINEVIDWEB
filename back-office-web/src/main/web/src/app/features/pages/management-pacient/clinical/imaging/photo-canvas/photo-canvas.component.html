<div class="step-container">
  <h3 class="step-title">Paso 2 — Análisis de Trazos y Ángulos</h3>
  <p class="step-subtitle">Selecciona una imagen de la izquierda para realizar las mediciones.</p>

  <div *ngIf="photos.length === 0" class="empty-state">
    <mat-icon>image_not_supported</mat-icon>
    <p>No se han capturado fotos aún. Regresa al paso anterior.</p>
  </div>

  <div *ngIf="photos.length > 0" class="canvas-layout" fxLayout="row" fxLayoutGap="20px">
    <!-- Listado Lateral de Miniaturas -->
    <div class="thumbnails-sidebar" fxFlex="200px">
      <div class="thumb-card"
           *ngFor="let photo of photos; let i = index"
           [class.active]="selectedPhoto?.photoOrder === photo.photoOrder"
           (click)="selectPhoto(photo)">
        <div class="thumb-img-wrapper">
          <img [src]="photo.photoUrl" [alt]="'Foto ' + photo.photoOrder" />
          <div class="thumb-index">#{{ i + 1 }}</div>
        </div>
        <div class="thumb-info">
          <span class="status-dot" [class.done]="photo.hasAnnotations"></span>
          {{ photo.hasAnnotations ? 'Con trazos' : 'Sin trazar' }}
        </div>
      </div>
    </div>

    <!-- Área de Trabajo Principal (Canvas) -->
    <div class="canvas-workspace" fxFlex>
      <div class="toolbar" *ngIf="selectedPhoto">
        <div class="tool-group">
          <button mat-flat-button color="primary" matTooltip="Dibujar línea vertical">
            <mat-icon>straighten</mat-icon> Vertical
          </button>
          <button mat-flat-button color="accent" matTooltip="Marcar ángulo">
            <mat-icon>architecture</mat-icon> Ángulo
          </button>
        </div>
        <div class="spacer"></div>
        <button mat-icon-button color="warn" matTooltip="Borrar todo">
          <mat-icon>delete_sweep</mat-icon>
        </button>
      </div>

      <div class="canvas-container" *ngIf="selectedPhoto">
        <img class="base-image" [src]="selectedPhoto.photoUrl" alt="Foto seleccionada" />
        <!-- Aquí irá el canvas HTML5 real en el futuro -->
        <div class="canvas-overlay-msg">
          <mat-icon>gesture</mat-icon>
          <span>Área de trazado activa</span>
        </div>
      </div>

      <div class="workspace-footer" *ngIf="selectedPhoto">
        <div class="angle-results" fxLayout="row" fxLayoutGap="24px">
          <div class="angle-box">
            <label>Ángulo Interno</label>
            <span class="value">0.00°</span>
          </div>
          <div class="angle-box">
            <label>Ángulo Externo</label>
            <span class="value">0.00°</span>
          </div>
        </div>
        <div class="spacer"></div>
        <button mat-raised-button color="primary" (click)="saveAnnotations('{}')">
          <mat-icon>save</mat-icon> Guardar Trazos
        </button>
      </div>
    </div>
  </div>

  <div class="step-actions">
    <button mat-stroked-button (click)="goPrev()">
      <mat-icon>chevron_left</mat-icon> Anterior
    </button>
    <button mat-raised-button color="primary" (click)="goNext()">
      Siguiente paso <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
